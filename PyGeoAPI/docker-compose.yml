services:
  pygeoapi:
    image: geopython/pygeoapi:latest
    container_name: pygeoapi
    volumes:
      - ./pygeoapi_instance/pygeoapi-config.yml:/pygeoapi/local.config.yml
      - ./pygeoapi_instance/processes:/pygeoapi/processes
    environment:
      - PYGEOAPI_CONFIG=/pygeoapi/local.config.yml
      - PYTHONPATH=/pygeoapi
    ports:
      - "5000:80"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_NUM_GPU=1
      - OLLAMA_GPU_OVERHEAD=0
    command: serve

  ollama-init:
    image: python:3.11-slim
    container_name: ollama-init
    depends_on:
      - ollama
    volumes:
      - ./ollama:/app
      - ollama:/root/.ollama
    env_file:
      - ollama/.env
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -e
        python -m pip install --no-cache-dir ollama && \
        python -u ollama-model-pull.py
    restart: "no"

volumes:
  ollama: {}
