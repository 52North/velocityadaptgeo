services:
  pygeoapi:
    image: geopython/pygeoapi:latest
    container_name: pygeoapi
    volumes:
      - ./pygeoapi_instance/pygeoapi-config.yml:/pygeoapi/local.config.yml
      - ./pygeoapi_instance/processes:/pygeoapi/processes
    environment:
      - PYGEOAPI_CONFIG=/pygeoapi/local.config.yml
      - PYTHONPATH=/pygeoapi
    ports:
      - "5000:80"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_NUM_GPU=1
      - OLLAMA_GPU_OVERHEAD=0
    command: serve

  ollama-init:
    image: python:3.11-slim
    container_name: ollama-init
    depends_on:
      - ollama
    volumes:
      - ./ollama:/app
      - ollama:/root/.ollama
    env_file:
      - ollama/.env
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -e
        python -m pip install --no-cache-dir ollama && \
        python -u ollama-model-pull.py
    restart: "no"

  nominatim:
    image: mediagis/nominatim:5.2
    container_name: nominatim
    environment:
      PBF_URL: "https://download.geofabrik.de/europe/germany/nordrhein-westfalen/muenster-regbez-latest.osm.pbf"
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true

  mcp:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fastmcp
    environment:
      - PYGEOAPI_URL=http://pygeoapi:80
    ports:
      - "0.0.0.0:8001:8001"
    depends_on:
      - pygeoapi

  langgraph:
    build:
      context: ./LangGraph
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - mcp
    restart: unless-stopped

volumes:
  ollama: {}
  photon_data:
