services:
  pygeoapi:
    image: geopython/pygeoapi:latest
    container_name: pygeoapi
    volumes:
      - ./pygeoapi_instance/pygeoapi-config.yml:/pygeoapi/local.config.yml
      - ./pygeoapi_instance/processes:/pygeoapi/processes
    environment:
      - PYGEOAPI_CONFIG=/pygeoapi/local.config.yml
      - PYTHONPATH=/pygeoapi
    ports:
      - "5000:80"

  mcp:
    build:
      context: mcp
      dockerfile: Dockerfile
    profiles: [ "mcp" ]
    environment:
      - PYGEOAPI_URL=http://pygeoapi:80
      - NOMINATIM_BASE_URL=http://nominatim:8080
    ports:
      - "8001:8001"

  langgraph:
    profiles: [ "langgraph" ]
    build:
      context: ./LangGraph
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
    env_file:
      - ./LangGraph/.env
    depends_on:
      - mcp
    restart: unless-stopped

  postgres-vector:
    image: pgvector/pgvector:pg16-trixie
    container_name: postgres-vector
    environment:
      POSTGRES_DB: velocityadaptgeo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./ogc_database/sql:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama: {}
  postgres_data: {}
