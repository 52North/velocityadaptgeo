# All configuration lives here. Only secrets are mounted at runtime, from LangGraph/.env.
x-postgres: &postgres
  POSTGRES_DB: velocityadaptgeo
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

# Index-side and query-side embedding must be the same model.
x-ollama: &ollama
  OLLAMA_MODEL: nomic-embed-text

# Local pygeoapi: the host-facing address that appears in generated URLs, and the
# in-network address every container actually calls.
x-pygeoapi: &pygeoapi
  LOCAL_PYGEOAPI_HOST: localhost:5000
  LOCAL_PYGEOAPI_INTERNAL: pygeoapi:80

# Remote OGC API servers, besides the local pygeoapi. The catalog crawler and the MCP server
# read the same list, so both workflow variants see the same processes; the langgraph runner
# executes nodes only against these servers.
x-ogc-servers: &ogc-servers
  OGC_SERVERS: https://demo.pygeoapi.io/master/,https://maps.ecere.com/ogcapi/

services:
  pygeoapi:
    build: ./pygeoapi_instance
    container_name: pygeoapi
    volumes:
      - ./pygeoapi_instance/pygeoapi-config.yml:/pygeoapi/local.config.yml
      - ./pygeoapi_instance/processes:/pygeoapi/processes
    environment:
      PYGEOAPI_CONFIG: /pygeoapi/local.config.yml
      PYTHONPATH: /pygeoapi
      NOMINATIM_URL: https://nominatim.openstreetmap.org/search
      OVERPASS_ENDPOINTS: https://overpass.kumi.systems/api/interpreter,https://overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter
      OSM_USER_AGENT: north52-coolspots/1.0
      HTTP_TIMEOUT: "30"
      OVERPASS_TIMEOUT: "180"
      OVERPASS_ATTEMPTS: "3"
      OVERPASS_BACKOFF: "2"
      OVERPASS_DEADLINE: "240"
      # Per request: the largest bounding box queried, and Overpass's memory cap (256 MiB).
      OVERPASS_MAX_AREA_KM2: "2500"
      OVERPASS_MAXSIZE: "268435456"
    # Host loopback only, like every published port: containers reach each other by service
    # name, and host runs (SETUP.md, src.batch) use localhost.
    ports:
      - "127.0.0.1:5000:80"
    # The mcp server and the catalog crawler read /processes once at startup, so they wait
    # until it answers, not just until the container has started.
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/processes?f=json', timeout=4)" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  langgraph:
    build:
      context: ./LangGraph
      dockerfile: Dockerfile
    # No auth unless LANGGRAPH_API_TOKEN is set, and every chat turn spends the Anthropic key: host
    # loopback only. From another machine, tunnel in: ssh -L 8000:localhost:8000 <user>@<host>
    ports:
      - "127.0.0.1:8000:8000"
    # Unprivileged and read-only: it writes only to the metrics/ volume and /tmp. The ids must be
    # allowed to write metrics/; set LANGGRAPH_UID/LANGGRAPH_GID in ./.env when they differ (SETUP.md).
    user: "${LANGGRAPH_UID:-1000}:${LANGGRAPH_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    dns:
      - 8.8.8.8
    env_file:
      - path: ./LangGraph/.env
        required: false
    environment:
      <<: [*postgres, *ollama, *pygeoapi, *ogc-servers]
      ANTHROPIC_MODEL: claude-haiku-5-5
      ANTHROPIC_EFFORT: medium
      ANTHROPIC_MAX_RETRIES: "3"
      MODEL_PRICES_PER_MTOK: claude-haiku-5-5=0.10,0.50
      MAX_WORKFLOW_ITERATIONS: "16"
      MAX_MAP_FEATURES: "3000"
      # development serves the demo frontend and the API docs; production serves neither and
      # refuses to start without LANGGRAPH_API_TOKEN (LangGraph/README.md).
      APP_ENV: development
      # Turns running at once (more get 429) and the time one may take (then 504 or an error event).
      MAX_CONCURRENT_TURNS: "4"
      TURN_TIMEOUT_SECONDS: "300"
      # DEBUG also logs whole conversations and streamed geometry; not for production.
      LOG_LEVEL: INFO
      # One of LangGraph/src/llm/variants.py: pgvector (catalog search), mcp (every tool of the mcp
      # service) or fewshot (whole catalog + few-shot examples). src.batch --variant overrides it.
      WORKFLOW_VARIANT: pgvector
      MCP_URL: http://mcp:8001/mcp
      # fewshot variant: examples shown per turn, and the cosine similarity an example needs.
      FEWSHOT_K: "2"
      FEWSHOT_MIN_SIMILARITY: "0"
      # Independent of the variant: also check the data kinds an edge carries (validator.py). Off by
      # default, as the variants were measured; on, the validator looks the processes up in the catalog.
      VALIDATE_IO_TYPES: "false"
      # One line per turn, with the user's prompt; empty turns it off (the default with APP_ENV=production).
      METRICS_FILE: metrics/runs.jsonl
      # Unset: Haiku decides alone. laya-shadow: the laya service also picks the manager's next
      # action, logged next to Haiku's in decision_history; Haiku still routes. Needs --profile laya.
      DECISION_MODEL: ""
      LAYA_URL: http://laya:8000
    volumes:
      - ./metrics:/app/metrics
      - ./prompts.jsonl:/app/prompts.jsonl:ro
    depends_on:
      postgres-vector:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      # pgvector variant: the catalog is complete before the first request searches it.
      ogc-database:
        condition: service_completed_successfully
    restart: unless-stopped

  # Tools for the mcp workflow variant; the tool list is crawled once at startup.
  mcp:
    build: ./mcp
    environment:
      <<: [*pygeoapi, *ogc-servers]
    dns:
      - 8.8.8.8
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      pygeoapi:
        condition: service_healthy
    restart: unless-stopped

  # Laya decision model for DECISION_MODEL=laya-shadow; only started with `--profile laya`, since
  # it downloads ~800 MB of weights and wants several GB of RAM. Published on the host's loopback
  # only (no auth unless LAYA_API_KEY is set), for batch runs from the host.
  laya:
    build: ./laya
    profiles: [ laya ]
    environment:
      LAYA_MODELS: english
      LAYA_MAX_LOADED: "1"
      LAYA_PRELOAD: "1"
      # Weights from the revisions the laya release reviewed, not whatever the Hub serves today.
      LAYA_REVISION: reviewed
      LAYA_THREADS: "4"
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - laya:/home/laya/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10m

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    # No auth on the Ollama API: host loopback only.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      <<: *ollama
    volumes:
      - ./scripts/pull-ollama-model.sh:/pull-ollama-model.sh:ro
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "/pull-ollama-model.sh" ]
    restart: "no"

  postgres-vector:
    image: pgvector/pgvector:pg16-trixie
    container_name: postgres-vector
    environment:
      <<: *postgres
      EMBED_DIM: "768"
    # Superuser postgres/postgres: host loopback only.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./ogc_database/sql:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ogc-database:
    build:
      context: ./ogc_database
      dockerfile: Dockerfile
    environment:
      <<: [*postgres, *ollama, *pygeoapi, *ogc-servers]
      HTTP_TIMEOUT: "30"
      CONCURRENT_REQUESTS: "5"
      # Few-shot examples of the fewshot variant, synced into the database on every run.
      FEWSHOT_DIR: /app/fewshot_examples
    volumes:
      - ./fewshot_examples:/app/fewshot_examples:ro
    dns:
      - 8.8.8.8
    depends_on:
      pygeoapi:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: "no"

volumes:
  laya: {}
  ollama: {}
  postgres_data: {}
