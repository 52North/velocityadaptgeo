services:
  pygeoapi:
    build: ./pygeoapi_instance
#    image: geopython/pygeoapi:latest
    container_name: pygeoapi
    volumes:
      - ./pygeoapi_instance/pygeoapi-config.yml:/pygeoapi/local.config.yml
      - ./pygeoapi_instance/processes:/pygeoapi/processes
    environment:
      - PYGEOAPI_CONFIG=/pygeoapi/local.config.yml
      - PYTHONPATH=/pygeoapi
    ports:
      - "5000:80"

  mcp:
    build:
      context: mcp
      dockerfile: Dockerfile
    #profiles: [ "mcp" ]
    environment:
      - PYGEOAPI_URL=http://pygeoapi:80
      - NOMINATIM_BASE_URL=http://nominatim:8080
    ports:
      - "8001:8001"

  langgraph:
    #profiles: [ "langgraph" ]
    build:
      context: ./LangGraph
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
    environment:
      - DB_DSN=postgresql://postgres:postgres@postgres-vector:5432/velocityadaptgeo
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=nomic-embed-text
      - MAX_WORKFLOW_ITERATIONS=16
    env_file:
      - ./LangGraph/.env
    volumes:
      # Mounted, not copied, so editing the test prompts does not need a rebuild.
      - ./prompts-summar.md:/app/prompts-summar.md:ro
    depends_on:
      mcp:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=nomic-embed-text
    volumes:
      - ./scripts/pull-ollama-model.sh:/pull-ollama-model.sh:ro
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "/pull-ollama-model.sh" ]
    restart: "no"

  postgres-vector:
    image: pgvector/pgvector:pg16-trixie
    container_name: postgres-vector
    environment:
      POSTGRES_DB: velocityadaptgeo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./ogc_database/sql:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot crawler: fills ogc_processes with embedded process metadata, then exits.
  # Same image is the manual re-crawl: docker compose run --rm ogc-database
  ogc-database:
    build:
      context: ./ogc_database
      dockerfile: Dockerfile
    environment:
      - DB_DSN=postgresql://postgres:postgres@postgres-vector:5432/velocityadaptgeo
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=nomic-embed-text
      - LOCAL_PYGEOAPI_URL=http://pygeoapi:80/
    dns:
      - 8.8.8.8
    depends_on:
      pygeoapi:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: "no"

volumes:
  ollama: {}
  postgres_data: {}
