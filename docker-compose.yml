# All configuration lives here. Only secrets are mounted at runtime, from LangGraph/.env.
x-postgres: &postgres
  POSTGRES_DB: velocityadaptgeo
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

# Index-side and query-side embedding must be the same model.
x-ollama: &ollama
  OLLAMA_MODEL: nomic-embed-text

# Local pygeoapi: the host-facing address that appears in generated URLs, and the
# in-network address every container actually calls.
x-pygeoapi: &pygeoapi
  LOCAL_PYGEOAPI_HOST: localhost:5000
  LOCAL_PYGEOAPI_INTERNAL: pygeoapi:80

# Remote OGC API servers, besides the local pygeoapi. The catalog crawler and the MCP server
# read the same list, so both workflow variants see the same processes.
x-ogc-servers: &ogc-servers
  OGC_SERVERS: https://demo.pygeoapi.io/master/,https://maps.ecere.com/ogcapi/

services:
  pygeoapi:
    build: ./pygeoapi_instance
    container_name: pygeoapi
    volumes:
      - ./pygeoapi_instance/pygeoapi-config.yml:/pygeoapi/local.config.yml
      - ./pygeoapi_instance/processes:/pygeoapi/processes
    environment:
      PYGEOAPI_CONFIG: /pygeoapi/local.config.yml
      PYTHONPATH: /pygeoapi
      NOMINATIM_URL: https://nominatim.openstreetmap.org/search
      OVERPASS_ENDPOINTS: https://overpass.kumi.systems/api/interpreter,https://overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter
      OSM_USER_AGENT: north52-coolspots/1.0
      HTTP_TIMEOUT: "30"
      OVERPASS_TIMEOUT: "180"
      OVERPASS_ATTEMPTS: "3"
      OVERPASS_BACKOFF: "2"
      OVERPASS_DEADLINE: "240"
    ports:
      - "5000:80"

  langgraph:
    build:
      context: ./LangGraph
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
    env_file:
      - path: ./LangGraph/.env
        required: false
    environment:
      <<: [*postgres, *ollama, *pygeoapi]
      ANTHROPIC_MODEL: claude-haiku-5-5
      ANTHROPIC_EFFORT: medium
      ANTHROPIC_MAX_RETRIES: "3"
      MODEL_PRICES_PER_MTOK: claude-haiku-5-5=0.10,0.50
      MAX_WORKFLOW_ITERATIONS: "16"
      MAX_MAP_FEATURES: "3000"
      HTTP_TIMEOUT: "30"
      # pgvector (catalog search) or mcp (every tool of the mcp service); src.batch --variant overrides it.
      WORKFLOW_VARIANT: pgvector
      MCP_URL: http://mcp:8001/mcp
      METRICS_FILE: metrics/runs.jsonl
    volumes:
      - ./metrics:/app/metrics
      - ./prompts.jsonl:/app/prompts.jsonl:ro
    depends_on:
      postgres-vector:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  # Tools for the mcp workflow variant; the tool list is crawled once at startup.
  mcp:
    build: ./mcp
    environment:
      <<: [*pygeoapi, *ogc-servers]
    dns:
      - 8.8.8.8
    ports:
      - "8001:8001"
    depends_on:
      pygeoapi:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      <<: *ollama
    volumes:
      - ./scripts/pull-ollama-model.sh:/pull-ollama-model.sh:ro
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "/pull-ollama-model.sh" ]
    restart: "no"

  postgres-vector:
    image: pgvector/pgvector:pg16-trixie
    container_name: postgres-vector
    environment:
      <<: *postgres
      EMBED_DIM: "768"
    ports:
      - "5432:5432"
    volumes:
      - ./ogc_database/sql:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ogc-database:
    build:
      context: ./ogc_database
      dockerfile: Dockerfile
    environment:
      <<: [*postgres, *ollama, *pygeoapi, *ogc-servers]
      HTTP_TIMEOUT: "30"
      CONCURRENT_REQUESTS: "5"
    dns:
      - 8.8.8.8
    depends_on:
      pygeoapi:
        condition: service_started
      postgres-vector:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: "no"

volumes:
  ollama: {}
  postgres_data: {}
