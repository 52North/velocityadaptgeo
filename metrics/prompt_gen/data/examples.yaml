# Few-shot examples for the paraphrase generator.
#
# spans: curated single-type edits from ETPC (textual_paraphrases.xml, etpc_label=1, sense-preserving).
#   `pair` is the ETPC pair_id, for tracing back. Spans without `pair` are hand-written, for types
#   ETPC has no usable example of. Picked by hand: many raw ETPC spans are noisy or mislabelled.
# demo: a hand-written full-sentence paraphrase per category. It uses a different geospatial request
#   than any seed on purpose, so the generator learns the operation without copying seed wording.

demo_source: Find all schools in Bonn that are within 500 metres of a bus stop and show them on a map.

