[project]
name = "prompt-gen"
version = "0.1.0"
description = "Chain-of-thought paraphrase generation for the MCP vs. RAG evaluation"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "ollama>=0.4",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "readchar>=4.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=3.0",
    "snowballstemmer>=3.1.1",
    "torch>=2.5",
]

[dependency-groups]
dev = ["pytest>=8.4.2"]

[project.scripts]
prompt-gen = "prompt_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_gen"]

# CPU-only torch: this machine has no CUDA GPU, and the default wheels pull in several GB of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
