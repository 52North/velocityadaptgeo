[project]
name = "prompt-review"
version = "0.1.0"
description = "Manual review of prompt_gen runs for the MCP vs. RAG evaluation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "readchar>=4.2.2",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=8.4.2"]

[project.scripts]
prompt-review = "prompt_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_review"]
