[project]
name = "prompt-review"
version = "0.1.0"
description = "Manual review of prompt_gen runs for the MCP vs. RAG evaluation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.17.0",
]

[project.scripts]
prompt-review = "prompt_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_review"]
