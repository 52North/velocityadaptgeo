[project]
name = "grading"
version = "0.1.0"
description = "Reference solution and output grading of the batch-built workflow graphs (CoolSpots / green-300m)"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1",
    "numpy>=2.0",
    "osmnx>=2.0",
    "shapely>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.17.0",
]

[tool.uv]
package = false  # two scripts, run with `uv run python <script>`

[tool.pytest.ini_options]
pythonpath = ["."]
