id: cologne-water-setback-50m

request: "Mark a 50 metre protective setback along the lakes and river surfaces in Cologne."

solution:
  workflow_graph:
    nodes:
      - id: city-boundary_1
        type: city-boundary
        config: {server_url: "http://pygeoapi:80/", place: "Cologne"}
        inputs: [place, bbox]
        outputs: [boundary, bbox, utmCrs, areaSqm]
      - id: osm-water-bodies_2
        type: osm-water-bodies
        config: {server_url: "http://pygeoapi:80/"}
        inputs: [area, tags]
        outputs: [features, count]
      - id: buffer_3
        type: buffer
        config: {server_url: "http://pygeoapi:80/", distance: 50}
        inputs: [geometry, distance]
        outputs: [result]
    edges:
      - {source: city-boundary_1, source_output: boundary, target: osm-water-bodies_2, target_input: area}
      - {source: osm-water-bodies_2, source_output: features, target: buffer_3, target_input: geometry}

notes: "buffer accepts a whole feature collection and dissolves the result, so the water features go into it directly. A single distance is a buffer; several distances would be multi-ring-buffer."
