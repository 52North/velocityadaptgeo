id: freiburg-vineyards-orchards-interior

request: "Combine the vineyards and orchards of Freiburg into one layer, keep only plots of at least 2 hectares, and measure how much interior each keeps beyond a 15 metre edge."

solution:
  workflow_graph:
    nodes:
      - id: city-boundary_1
        type: city-boundary
        config: {server_url: "http://pygeoapi:80/", place: "Freiburg im Breisgau"}
        inputs: [place, bbox]
        outputs: [boundary, bbox, utmCrs, areaSqm]
      - id: osm-green-areas_2
        type: osm-green-areas
        config: {server_url: "http://pygeoapi:80/", tags: {landuse: vineyard}}
        inputs: [area, tags]
        outputs: [features, count]
      - id: osm-green-areas_3
        type: osm-green-areas
        config: {server_url: "http://pygeoapi:80/", tags: {landuse: orchard}}
        inputs: [area, tags]
        outputs: [features, count]
      - id: feature-merge_4
        type: feature-merge
        config: {server_url: "http://pygeoapi:80/", dissolve: true}
        inputs: [features, otherFeatures, dissolve]
        outputs: [features, count]
      - id: min-area-filter_5
        type: min-area-filter
        config: {server_url: "http://pygeoapi:80/", minArea: 20000}
        inputs: [features, minArea]
        outputs: [features, count, removed]
      - id: core-area-metrics_6
        type: core-area-metrics
        config: {server_url: "http://pygeoapi:80/", edgeWidth: 15}
        inputs: [features, edgeWidth]
        outputs: [cores, features, coreAreaSqm, withCore]
    edges:
      - {source: city-boundary_1, source_output: boundary, target: osm-green-areas_2, target_input: area}
      - {source: city-boundary_1, source_output: boundary, target: osm-green-areas_3, target_input: area}
      - {source: osm-green-areas_2, source_output: features, target: feature-merge_4, target_input: features}
      - {source: osm-green-areas_3, source_output: features, target: feature-merge_4, target_input: otherFeatures}
      - {source: feature-merge_4, source_output: features, target: min-area-filter_5, target_input: features}
      - {source: min-area-filter_5, source_output: features, target: core-area-metrics_6, target_input: features}

notes: "The merge comes before the size filter, because the request filters the combined layer: with dissolve: true, a vineyard and an orchard that touch count as one plot. The full place name avoids other towns called Freiburg."
