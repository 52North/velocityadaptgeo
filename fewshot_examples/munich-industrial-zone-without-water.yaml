id: munich-industrial-zone-without-water

request: "Show the land within 500 metres of the industrial areas in Munich, leaving out lakes and rivers."

solution:
  workflow_graph:
    nodes:
      - id: city-boundary_1
        type: city-boundary
        config: {server_url: "http://pygeoapi:80/", place: "Munich"}
        inputs: [place, bbox]
        outputs: [boundary, bbox, utmCrs, areaSqm]
      - id: osm-green-areas_2
        type: osm-green-areas
        config: {server_url: "http://pygeoapi:80/", tags: {landuse: industrial}}
        inputs: [area, tags]
        outputs: [features, count]
      - id: buffer_3
        type: buffer
        config: {server_url: "http://pygeoapi:80/", distance: 500}
        inputs: [geometry, distance]
        outputs: [result]
      - id: osm-water-bodies_4
        type: osm-water-bodies
        config: {server_url: "http://pygeoapi:80/"}
        inputs: [area, tags]
        outputs: [features, count]
      - id: geometry-difference_5
        type: geometry-difference
        config: {server_url: "http://pygeoapi:80/"}
        inputs: [subject, subtrahend]
        outputs: [result, areaSqm, shareOfSubject]
    edges:
      - {source: city-boundary_1, source_output: boundary, target: osm-green-areas_2, target_input: area}
      - {source: osm-green-areas_2, source_output: features, target: buffer_3, target_input: geometry}
      - {source: city-boundary_1, source_output: boundary, target: osm-water-bodies_4, target_input: area}
      - {source: buffer_3, source_output: result, target: geometry-difference_5, target_input: subject}
      - {source: osm-water-bodies_4, source_output: features, target: geometry-difference_5, target_input: subtrahend}

notes: "The subject of geometry-difference does not have to be the city boundary: here the buffer zone is the subject and the water is cut out of it. The two branches only meet at the difference."
