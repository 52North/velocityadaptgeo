<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>

    <meta charset="UTF-8" />
    <title>Geometry Assistant</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="app">
        <header class="header">
            Geometry Assistant
        </header>

        <main id="chat" class="chat"></main>

        <form id="chat-form" class="input-area">
            <input id="prompt" type="text" placeholder="Ask something about geometry…" autocomplete="off" required />
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>

</html>
