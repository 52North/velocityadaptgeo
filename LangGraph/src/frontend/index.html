<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>

    <meta charset="UTF-8" />
    <title>Geometry Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app">
        <div class="left-panel">
            <header class="header">
                Geometry Assistant
            </header>

            <main id="chat" class="chat"></main>

            <form id="chat-form" class="input-area">
                <input id="prompt" type="text" placeholder="Ask something about geometry…" autocomplete="off"
                    required />
                <button type="submit">Send</button>
            </form>
        </div>

        <!-- RIGHT SIDE EXECUTION GRAPH -->
        <div class="right-panel">
            <header class="header graph-header">
                <span>Execution Graph</span>
                <span id="graph-status" class="graph-status">empty</span>
            </header>
            <div id="graph" class="graph-canvas"></div>
        </div>
    </div>
</body>



</html>
